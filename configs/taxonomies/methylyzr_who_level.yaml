# Many-to-one mapping from the 91 GSE90496 (Capper 2018) classes to the WHO-level labels of the
# MethyLYZR Zenodo cohort (R9 + R10). Documented in docs/METHYLYZR_LABEL_MAPPING.md.
# Reusable format: a later configs/taxonomies/sturgeon_general_87.yaml can use the same keys.
#   classes[].coarse         default decision (every source class appears exactly once)
#   classes[].alt_coarse     the other plausible target when confidence is ambiguous (not applied)
#   other_label              prediction side: mass of classes that no cohort label covers
#   out_of_scope_label       truth side only: nothing among the 91 classes maps to it
#   cohort_labels            truth side: cohort label_short -> coarse label
# Not a medical decision: a documented, defensible mapping with open questions.
name: methylyzr_who_level
version: 1
source_taxonomy: gse90496_91
cohort: "MethyLYZR Zenodo 10.5281/zenodo.13236096 (labels: Brandl et al. Nat Med 2025, Supp. Tables 10 and 15)"
other_label: OTHER_91
out_of_scope_label: OUT_OF_SCOPE
coarse_labels: ["A IDH", "O IDH", "GBM", "PXA", "MNG", "MB", "EPN", "LYMPHO", "PA", "PLEX", "ATRT", "DMG, K27", "CONTR, REACT", "OTHER_91"]
