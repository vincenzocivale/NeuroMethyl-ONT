  "DMG, K27": {coarse: "DMG, K27"}
  "CONTR, REACT": {coarse: "CONTR, REACT"}
  "Lung cancer metastasis": {coarse: OUT_OF_SCOPE, abstention_test: true}
  "Breast cancer metastasis": {coarse: OUT_OF_SCOPE, abstention_test: true}
  "Colorectal cancer metastasis": {coarse: OUT_OF_SCOPE, abstention_test: true}
  "Endometrial cancer metastasis": {coarse: OUT_OF_SCOPE, abstention_test: true}
  "Melanoma metastasis": {coarse: OUT_OF_SCOPE, abstention_test: true, note: "the 91 classes contain MELAN (melanoma, 'Metastatic tumor' in MethyLYZR's table): a MELAN call is arguably correct, not an error"}
