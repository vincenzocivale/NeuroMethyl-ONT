model:
  name: evidence_linear_v1
  id: E1
  representation: evidence
  family: evidence_linear
  architecture:
    hidden_layers: 0
    bias: true
  # First run: kappa = 2, no sweep yet (docs/EVIDENCE_LINEAR_V1.md #10).
  # kappa = 0 disables coverage shrinkage and E1 degenerates toward C0 --
  # a natural ablation for a later sweep over {0, 1, 2, 4, 8}.
  kappa: 2.0

optimizer:
  name: AdamW
  lr: 3.0e-4
  weight_decay: 1.0e-4

training:
  batch_size: 16
  max_epochs: 80
  early_stopping_patience: 12
  mixed_precision: bf16

loss:
  name: cross_entropy

seed: 17
