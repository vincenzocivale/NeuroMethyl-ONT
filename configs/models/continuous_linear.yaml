model:
  name: continuous_linear
  id: Beta
  representation: continuous
  family: evidence_linear
  architecture:
    hidden_layers: 0
    bias: true

optimizer:
  name: AdamW
  lr: 3.0e-4
  weight_decay: 1.0e-4

training:
  batch_size: 128
  # Sixteen CPU threads for synthetic count generation; bounded for the shared server.
  # for a shared server.
  batch_encoding_workers: 16
  max_epochs: 80
  early_stopping_patience: 12
  mixed_precision: bf16

loss:
  name: cross_entropy

seed: 17
